# Social and contact links shown on the about page and in the footer.
#
# TWO GOTCHAS, both learned the hard way:
#  1. A key present with an EMPTY value crashes the build — jekyll-socials
#     does `baseurl + value` and blows up on nil.
#  2. `rss_icon: false` still renders the icon. The plugin's rss_icon branch
#     never looks at the value, only at whether the key exists.
# So: leave unused entries COMMENTED OUT. Never blank, never false.

# cv_pdf: /assets/pdf/courtney_brell_cv.pdf
# email: you@university.edu
# google_scholar_id:   # the string after "user=" in your Scholar profile URL
# orcid_id:            # e.g. 0000-0002-1825-0097
# linkedin_username:
# github_username:
# bluesky_url:
# x_username:
# rss_icon: true       # only if a blog ever exists
